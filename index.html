<script>
  // ডায়াগনস্টিক: কোনো এরর হলে সরাসরি স্ক্রিনে দেখাবে (মোবাইলে DevTools না থাকলেও)
  function showFatalError(label, detail) {
    var el = document.getElementById("root");
    if (el) {
      el.innerHTML =
        '<div style="padding:16px;color:#A63D40;font-family:monospace;white-space:pre-wrap;font-size:13px;line-height:1.5;background:#FFF3F0;border:1px solid #A63D40;margin:12px;border-radius:6px;">' +
        "⚠ " + label + "\n\n" + detail + "</div>";
    }
  }
  window.onerror = function (msg, url, line, col) {
    showFatalError("JavaScript Error", msg + "\n" + (url || "") + ":" + line + ":" + col);
  };
  window.addEventListener("unhandledrejection", function (event) {
    var reason = event.reason;
    var text = (reason && (reason.message || reason.toString())) || String(reason);
    showFatalError("Unhandled Promise Rejection", text);
  });
  // ৱ৫ সেকেন্ড পরও লোড না হলে টাইমআউট মেসেজ
  setTimeout(function () {
    var el = document.getElementById("root");
    if (el && el.textContent.indexOf("হিসাবের খাতা খোলা হচ্ছে") !== -1) {
      showFatalError(
        "লোডিং টাইমআউট",
        "১৫ সেকেন্ড পরও অ্যাপ লোড হয়নি। সম্ভবত React/Firebase/Babel-এর কোনো একটা CDN স্ক্রিপ্ট লোড হতে পারছে না (নেটওয়ার্ক বা ব্লকিং সমস্যা)।"
      );
    }
  }, 15000);
</script>

    measurementId: "G-8WLLNZWG2C",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const KV = "kv";

  function safeId(key) { return encodeURIComponent(key); }

  window.storage = {
    async get(key, shared = false) {
      if (!shared) {
        const v = localStorage.getItem(key);
        if (v === null) throw new Error("key not found: " + key);
        return { key, value: v, shared };
      }
      const snap = await db.collection(KV).doc(safeId(key)).get();
      if (!snap.exists) throw new Error("key not found: " + key);
      return { key, value: snap.data().value, shared };
    },
    async set(key, value, shared = false) {
      if (!shared) {
        localStorage.setItem(key, value);
        return { key, value, shared };
      }
      await db.collection(KV).doc(safeId(key)).set({ key, value });
      return { key, value, shared };
    },
    async delete(key, shared = false) {
      if (!shared) {
        localStorage.removeItem(key);
        return { key, deleted: true, shared };
      }
      await db.collection(KV).doc(safeId(key)).delete();
      return { key, deleted: true, shared };
    },
    async list(prefix = "", shared = false) {
      if (!shared) {
        const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix));
        return { keys, prefix, shared };
      }
      const snap = await db.collection(KV).get();
      const keys = snap.docs.map((d) => d.data().key || d.id).filter((k) => k.startsWith(prefix));
      return { keys, prefix, shared };
    },
  };
</script>

function PinModal({ mode, onClose, onSubmit, error }) {
  const [oldPin, setOldPin] = useState("");
  const [pin1, setPin1] = useState("");
  const [pin2, setPin2] = useState("");

  const titles = { setup: "খাতার জন্য একটি PIN সেট করুন", unlock: "এডিট করতে PIN দিন", change: "PIN পরিবর্তন করুন" };

  const submit = () => {
    if (mode === "unlock") onSubmit({ pin: pin1 });
    else if (mode === "setup") {
      if (pin1.length < 4) return onSubmit({ error: "কমপক্ষে ৪ সংখ্যার PIN দিন" });
      if (pin1 !== pin2) return onSubmit({ error: "দুটি PIN মিলছে না" });
      onSubmit({ newPin: pin1 });
    } else if (mode === "change") {
      if (pin1.length < 4) return onSubmit({ error: "কমপক্ষে ৪ সংখ্যার PIN দিন" });
      if (pin1 !== pin2) return onSubmit({ error: "দুটি PIN মিলছে না" });
      onSubmit({ oldPin, newPin: pin1 });
    }
  };

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(36,42,38,0.55)", display: "flex",
      alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16,
    }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: T.card, borderRadius: 6, padding: 20, width: "100%", maxWidth: 320,
        fontFamily: "'Hind Siliguri', sans-serif", border: `1px solid ${T.border}`,
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ margin: 0, fontFamily: "'Tiro Bangla', serif", fontSize: 17, color: T.ink }}>{titles[mode]}</h3>
          <button onClick={onClose} style={{ border: "none", background: "transparent", cursor: "pointer", color: T.inkSoft }}>
            <Emoji size={18}>✖️</Emoji>
          </button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {mode === "change" && (
            <Field label="বর্তমান PIN">
              <TextInput type="password" inputMode="numeric" value={oldPin} onChange={(e) => setOldPin(e.target.value)} />
            </Field>
          )}
          {mode === "unlock" ? (
            <Field label="PIN">
              <TextInput type="password" inputMode="numeric" autoFocus value={pin1}
                onChange={(e) => setPin1(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} />
            </Field>
          ) : (
            <>
              <Field label="নতুন PIN (কমপক্ষে ৪ সংখ্যা)">
                <TextInput type="password" inputMode="numeric" value={pin1} onChange={(e) => setPin1(e.target.value)} />
              </Field>
              <Field label="নতুন PIN আবার দিন">
                <TextInput type="password" inputMode="numeric" value={pin2} onChange={(e) => setPin2(e.target.value)} />
              </Field>
            </>
          )}
          {error && <div style={{ color: T.danger, fontSize: 12.5 }}>{error}</div>}
          <LedgerButton onClick={submit} color={T.gold} style={{ justifyContent: "center", marginTop: 4 }}>নিশ্চিত করুন</LedgerButton>
          <p style={{ fontSize: 11, color: T.inkSoft, margin: "4px 0 0", lineHeight: 1.5 }}>
            লক্ষ্য রাখুন: এই PIN শুধু কারা এডিট করতে পারবে তা আলাদা করার জন্য একটি সহজ ব্যবস্থা — শক্তিশালী নিরাপত্তা ব্যবস্থা নয়। PIN গোপন রাখুন।
          </p>
        </div>
      </div>
    </div>
  );
}

  const [members, setMembers] = useState([]);
  const [whatsapp, setWhatsapp] = useState([]);
  const [records, setRecords] = useState({ cow: emptyRecords(), chicken: emptyRecords(), goat: emptyRecords() });
  const [pin, setPin] = useState(null);
  const [isEditor, setIsEditor] = useState(false);
  const [modal, setModal] = useState(null);
  const [modalError, setModalError] = useState("");
  const [printJob, setPrintJob] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [subTab, setSubTab] = useState("ledger");
  const printTimer = useRef(null);

  const fetchAll = useCallback(async () => {
    const [mRes, wRes, pRes, cowRes, chkRes, goatRes] = await Promise.all([
      window.storage.get(STORAGE_KEYS.members, true).catch(() => null),
      window.storage.get(STORAGE_KEYS.whatsapp, true).catch(() => null),
      window.storage.get(STORAGE_KEYS.pin, true).catch(() => null),
      window.storage.get(STORAGE_KEYS.cow, true).catch(() => null),
      window.storage.get(STORAGE_KEYS.chicken, true).catch(() => null),
      window.storage.get(STORAGE_KEYS.goat, true).catch(() => null),
    ]);
    if (mRes && mRes.value) { try { setMembers(JSON.parse(mRes.value)); } catch (e) {} }
    if (wRes && wRes.value) { try { setWhatsapp(JSON.parse(wRes.value)); } catch (e) {} }
    setPin(pRes && pRes.value ? pRes.value : "");
    setRecords({
      cow: cowRes && cowRes.value ? { ...emptyRecords(), ...JSON.parse(cowRes.value) } : emptyRecords(),
      chicken: chkRes && chkRes.value ? { ...emptyRecords(), ...JSON.parse(chkRes.value) } : emptyRecords(),
      goat: goatRes && goatRes.value ? { ...emptyRecords(), ...JSON.parse(goatRes.value) } : emptyRecords(),
    });
    return pRes && pRes.value ? pRes.value : "";
  }, []);

  useEffect(() => {
    (async () => {
      const serverPin = await fetchAll();
      let cached = "";
      try {
        const c = await window.storage.get("editor-pin-cache", false).catch(() => null);
        cached = c && c.value ? c.value : "";
      } catch (e) {}
      if (serverPin && cached && cached === serverPin) setIsEditor(true);
      setLoaded(true);
    })();
  }, [fetchAll]);

  useEffect(() => {
    if (!loaded) return;
    const iv = setInterval(() => { fetchAll(); }, 5000);
    return () => clearInterval(iv);
  }, [loaded, fetchAll]);

  useEffect(() => { return () => printTimer.current && clearTimeout(printTimer.current); }, []);

  const saveMembers = useCallback(async (list) => {
    setMembers(list);
    try { await window.storage.set(STORAGE_KEYS.members, JSON.stringify(list), true); } catch (e) {}
  }, []);

  const saveWhatsapp = useCallback(async (list) => {
    setWhatsapp(list);
    try { await window.storage.set(STORAGE_KEYS.whatsapp, JSON.stringify(list), true); } catch (e) {}
  }, []);

  const saveRecordsFor = useCallback(async (farmKey, data) => {
    setRecords((prev) => ({ ...prev, [farmKey]: data }));
    try { await window.storage.set(`records-${farmKey}`, JSON.stringify(data), true); } catch (e) {}
  }, []);

  const openUnlock = () => { setModalError(""); setModal(pin ? "unlock" : "setup"); };
  const openChangePin = () => { setModalError(""); setModal("change"); };
  const lockNow = async () => {
    setIsEditor(false);
    try { await window.storage.set("editor-pin-cache", "", false); } catch (e) {}
  };
  const handleModalSubmit = async (payload) => {
    if (payload.error) { setModalError(payload.error); return; }
    if (modal === "unlock") {
      if (payload.pin === pin) {
        setIsEditor(true); setModal(null);
        try { await window.storage.set("editor-pin-cache", payload.pin, false); } catch (e) {}
      } else { setModalError("ভুল PIN, আবার চেষ্টা করুন"); }
    } else if (modal === "setup") {
      setPin(payload.newPin);
      try {
        await window.storage.set(STORAGE_KEYS.pin, payload.newPin, true);
        await window.storage.set("editor-pin-cache", payload.newPin, false);
      } catch (e) {}
      setIsEditor(true); setModal(null);
    } else if (modal === "change") {
      if (payload.oldPin !== pin) { setModalError("বর্তমান PIN সঠিক নয়"); return; }
      setPin(payload.newPin);
      try {
        await window.storage.set(STORAGE_KEYS.pin, payload.newPin, true);
        await window.storage.set("editor-pin-cache", payload.newPin, false);
      } catch (e) {}
      setModal(null);
    }
  };

  const buildFullReportJob = () => {
    const grand = Object.values(farmTotals).reduce((a, t) => ({
      capital: a.capital + t.capital, income: a.income + t.income, expense: a.expense + t.expense, profit: a.profit + t.profit,
    }), { capital: 0, income: 0, expense: 0, profit: 0 });

    const sections = [{
      heading: "সার্বিক সারসংক্ষেপ",
      summaryRows: [
        ["মোট সদস্য", members.length.toString()],
        ["সর্বমোট সদস্য-মূলধন", taka(grand.capital)],
        ["সর্বমোট আয়", taka(grand.income)],
        ["সর্বমোট খরচ", taka(grand.expense)],
        ["সর্বমোট লাভ/ক্ষতি", taka(grand.profit)],
      ],
    }];

    Object.entries(FARMS).forEach(([key, farm]) => {
      const t = farmTotals[key];
      const r = records[key];
      const nameOf = (id) => members.find((m) => m.id === id)?.name || "অজানা সদস্য";
      const deposits = [...r.deposits].sort((a, b) => (a.date < b.date ? 1 : -1));
      const expenses = [...r.expenses].sort((a, b) => (a.date < b.date ? 1 : -1));
      const incomes = [...r.incomes].sort((a, b) => (a.date < b.date ? 1 : -1));

      sections.push({
        heading: farm.label,
        summaryRows: [
          ["মোট জমা", taka(t.deposit)], ["মোট উত্তোলন", taka(t.withdraw)], ["সদস্য-মূলধন (নিট)", taka(t.capital)],
          ["মোট আয়", taka(t.income)], ["মোট খরচ", taka(t.expense)], ["নিট লাভ/ক্ষতি", taka(t.profit)],
        ],
        tables: [
          deposits.length ? { title: "জমা/উত্তোলন", columns: [{ key: "date", label: "তারিখ" }, { key: "name", label: "সদস্য" }, { key: "type", label: "ধরন" }, { key: "amount", label: "পরিমাণ" }], rows: deposits.map((d) => ({ date: d.date, name: nameOf(d.memberId), type: d.type, amount: taka(d.amount) })) } : null,
          expenses.length ? { title: "খরচ", columns: [{ key: "date", label: "তারিখ" }, { key: "category", label: "খাত" }, { key: "amount", label: "পরিমাণ" }], rows: expenses.map((e) => ({ date: e.date, category: e.category, amount: taka(e.amount) })) } : null,
          incomes.length ? { title: "আয়", columns: [{ key: "date", label: "তারিখ" }, { key: "category", label: "খাত" }, { key: "amount", label: "পরিমাণ" }], rows: incomes.map((inc) => ({ date: inc.date, category: inc.category, amount: taka(inc.amount) })) } : null,
        ].filter(Boolean),
      });
    });

    if (members.length > 0) {
      sections.push({
        heading: "সদস্য অনুযায়ী মূলধন (সকল খামার)",
        tables: [{
          columns: [{ key: "name", label: "নাম" }, { key: "cow", label: "গরু" }, { key: "chicken", label: "মুরগি" }, { key: "goat", label: "ছাগল" }, { key: "total", label: "সর্বমোট" }],
          rows: members.map((m) => ({ name: m.name, cow: taka(memberCapital(m.id, "cow")), chicken: taka(memberCapital(m.id, "chicken")), goat: taka(memberCapital(m.id, "goat")), total: taka(memberTotalCapital(m.id)) })),
        }],
      });
    }
    return { title: "সম্পূর্ণ হিসাব রিপোর্ট — সকল খামার", sections };
  };

  const requestPrint = (job) => {
    setPrintJob(job);
    printTimer.current = setTimeout(() => { try { window.print(); } catch (e) {} }, 150);
  };

  const [memberForm, setMemberForm] = useState({ name: "", phone: "", joinDate: todayStr() });
  const addMember = () => {
    if (!isEditor || !memberForm.name.trim()) return;
    saveMembers([...members, { id: uid(), ...memberForm }]);
    setMemberForm({ name: "", phone: "", joinDate: todayStr() });
  };
  const removeMember = (id) => isEditor && saveMembers(members.filter((m) => m.id !== id));

  const farmTotals = useMemo(() => {
    const out = {};
    for (const key of Object.keys(FARMS)) {
      const r = records[key];
      const deposit = sum(r.deposits.filter((d) => d.type === "জমা"), (d) => d.amount);
      const withdraw = sum(r.deposits.filter((d) => d.type === "উত্তোলন"), (d) => d.amount);
      const expense = sum(r.expenses, (e) => e.amount);
      const income = sum(r.incomes, (i) => i.amount);
      out[key] = { deposit, withdraw, capital: deposit - withdraw, expense, income, profit: income - expense };
    }
    return out;
  }, [records]);

  const memberCapital = useCallback((memberId, farmKey) => {
    const r = records[farmKey];
    const d = sum(r.deposits.filter((x) => x.memberId === memberId && x.type === "জমা"), (x) => x.amount);
    const w = sum(r.deposits.filter((x) => x.memberId === memberId && x.type === "উত্তোলন"), (x) => x.amount);
    return d - w;
  }, [records]);
  const memberTotalCapital = useCallback((memberId) => Object.keys(FARMS).reduce((a, k) => a + memberCapital(memberId, k), 0), [memberCapital]);

  if (!loaded) {
    return <div style={{ padding: 40, textAlign: "center", color: T.inkSoft, fontFamily: "'Hind Siliguri', sans-serif" }}>হিসাবের খাতা খোলা হচ্ছে…</div>;
  }

  return (
    <div style={{ fontFamily: "'Hind Siliguri', sans-serif", background: T.paper, minHeight: "100%", color: T.ink }}>
      <style>{`
        .print-area { display: none; }
        @media print {
          .app-normal { display: none !important; }
          .print-area { display: block !important; padding: 10px; }
        }
      `}</style>

      <div className="app-normal">
        <div style={{ padding: "18px 18px 14px", background: T.paperDark, borderBottom: `2px solid ${T.margin}`, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
          <div>
            <h1 style={{ margin: 0, fontFamily: "'Tiro Bangla', serif", fontSize: 24, color: T.ink }}>হিসাবের খাতা</h1>
            <p style={{ margin: "4px 0 0", fontSize: 13, color: T.inkSoft }}>সমবায় খামার ব্যবস্থাপনা — গরু · মুরগি · ছাগল</p>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {isEditor ? (
              <>
                <span style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: T.goat, fontWeight: 600, background: T.goat + "1a", padding: "5px 9px", borderRadius: 3 }}>
                  <Emoji size={13}>🔓</Emoji> এডিট মোড
                </span>
                <button onClick={openChangePin} title="PIN পরিবর্তন" style={{ border: "none", background: "transparent", color: T.inkSoft, cursor: "pointer", fontSize: 12 }}>PIN বদলান</button>
                <button onClick={lockNow} style={{ border: `1px solid ${T.border}`, background: "transparent", color: T.inkSoft, borderRadius: 3, padding: "5px 9px", fontSize: 12, cursor: "pointer" }}>লক করুন</button>
              </>
            ) : (
              <button onClick={openUnlock} style={{ display: "flex", alignItems: "center", gap: 5, border: `1px solid ${T.gold}`, background: "transparent", color: T.gold, borderRadius: 3, padding: "6px 10px", fontSize: 12.5, cursor: "pointer", fontWeight: 600 }}>
                <Emoji size={13}>🔒</Emoji> শুধু দেখা — এডিট মোড
              </button>
            )}
          </div>
        </div>

        <div style={{ display: "flex", gap: 4, padding: "10px 12px 0", overflowX: "auto" }}>
          {[
            { key: "dashboard", label: "ড্যাশবোর্ড", color: T.neutral, icon: "🏠" },
            { key: "cow", label: FARMS.cow.label, color: T.cow, icon: "🐾" },
            { key: "chicken", label: FARMS.chicken.label, color: T.chicken, icon: "🥚" },
            { key: "goat", label: FARMS.goat.label, color: T.goat, icon: "🐾" },
            { key: "whatsapp", label: "WhatsApp নাম্বার", color: T.whatsapp, icon: "💬" },
            { key: "members", label: "সদস্যগণ", color: T.gold, icon: "👥" },
          ].map(({ key, label, color, icon }) => {
            const active = tab === key;
            return (
              <button key={key} onClick={() => { setTab(key); setSubTab("ledger"); }} style={{
                flex: "0 0 auto", display: "flex", alignItems: "center", gap: 6, padding: "9px 14px",
                fontSize: 13.5, fontWeight: 600, border: "none", borderRadius: "6px 6px 0 0", cursor: "pointer",
                background: active ? T.card : "transparent", color: active ? color : T.inkSoft,
                boxShadow: active ? `inset 0 -3px 0 ${color}` : "none", fontFamily: "'Hind Siliguri', sans-serif",
              }}>
                <Emoji size={15}>{icon}</Emoji>{label}
              </button>
            );
          })}
        </div>

        <div style={{ padding: 14 }}>
          {tab === "dashboard" && <Dashboard totals={farmTotals} memberCount={members.length} onDownloadFull={() => requestPrint(buildFullReportJob())} />}
          {["cow", "chicken", "goat"].includes(tab) && (
            <FarmPage farmKey={tab} farm={FARMS[tab]} totals={farmTotals[tab]} records={records[tab]} members={members}
              subTab={subTab} setSubTab={setSubTab} saveRecords={(d) => saveRecordsFor(tab, d)} memberCapital={memberCapital}
              isEditor={isEditor} onRequestUnlock={openUnlock} requestPrint={requestPrint} />
          )}
          {tab === "whatsapp" && <WhatsAppTab items={whatsapp} onSave={saveWhatsapp} isEditor={isEditor} onRequestUnlock={openUnlock} requestPrint={requestPrint} />}
          {tab === "members" && (
            <MembersPage members={members} memberForm={memberForm} setMemberForm={setMemberForm} addMember={addMember}
              removeMember={removeMember} memberTotalCapital={memberTotalCapital} memberCapital={memberCapital}
              isEditor={isEditor} onRequestUnlock={openUnlock} requestPrint={requestPrint} />
          )}
        </div>

        <p style={{ textAlign: "center", fontSize: 11.5, color: T.inkSoft, padding: "6px 10px 16px" }}>
          এই খাতার তথ্য সবাই দেখতে পাবে; এডিট (যোগ/মুছা) করতে PIN প্রয়োজন। এডিট করলে প্রায় ৫ সেকেন্ডের মধ্যে সবার পাতায় হালনাগাদ হয়ে যাবে।
        </p>
      </div>

      <PrintArea job={printJob} />
      {modal && <PinModal mode={modal} error={modalError} onClose={() => setModal(null)} onSubmit={handleModalSubmit} />}
    </div>
  );
}

function Dashboard({ totals, memberCount, onDownloadFull }) {
  const grand = Object.values(totals).reduce((a, t) => ({
    capital: a.capital + t.capital, income: a.income + t.income, expense: a.expense + t.expense, profit: a.profit + t.profit,
  }), { capital: 0, income: 0, expense: 0, profit: 0 });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <PageFrame>
        <SectionHeader title="সব খামার একসাথে" right={<PdfButton onClick={onDownloadFull} color={T.neutral} />} />
        <div style={{ padding: "14px 16px 14px 20px", display: "flex", flexWrap: "wrap", gap: 18 }}>
          <SummaryStat label="মোট সদস্য" value={memberCount.toString()} color={T.gold} icon="👥" />
          <SummaryStat label="সর্বমোট সদস্য-মূলধন" value={taka(grand.capital)} color={T.neutral} icon="👛" />
          <SummaryStat label="সর্বমোট লাভ/ক্ষতি" value={taka(grand.profit)} color={grand.profit >= 0 ? T.goat : T.danger} icon={grand.profit >= 0 ? "📈" : "📉"} />
        </div>
        <div style={{ padding: "0 16px 14px", fontSize: 12, color: T.inkSoft }}>
          "PDF ডাউনলোড" বাটনে চাপলে গরু, মুরগি ও ছাগল — তিনটি খামারের সম্পূর্ণ হিসাব (জমা/উত্তোলন, খরচ, আয়, সদস্য-মূলধন) এক PDF-এ পাবেন।
        </div>
      </PageFrame>

      {Object.entries(FARMS).map(([key, farm]) => {
        const t = totals[key];
        return (
          <PageFrame key={key}>
            <div style={{ display: "flex" }}>
              <div style={{ width: 6, background: farm.color }} />
              <div style={{ flex: 1, padding: "12px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                  <Emoji size={17}>{farm.icon}</Emoji>
                  <span style={{ fontFamily: "'Tiro Bangla', serif", fontSize: 16.5 }}>{farm.label}</span>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 16, fontSize: 13.5 }}>
                  <Metric label="সদস্য-মূলধন" value={taka(t.capital)} />
                  <Metric label="মোট আয়" value={taka(t.income)} />
                  <Metric label="মোট খরচ" value={taka(t.expense)} />
                  <Metric label="নিট লাভ/ক্ষতি" value={taka(t.profit)} color={t.profit >= 0 ? T.goat : T.danger} bold />
                </div>
              </div>
            </div>
          </PageFrame>
        );
      })}
    </div>
  );
}

function SummaryStat({ label, value, color, icon }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, flex: "1 1 150px" }}>
      <div style={{ width: 34, height: 34, borderRadius: "50%", background: color + "1c", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Emoji size={17}>{icon}</Emoji>
      </div>
      <div>
        <div style={{ fontSize: 11.5, color: T.inkSoft }}>{label}</div>
        <div style={{ fontSize: 17, fontWeight: 700, color: T.ink, fontVariantNumeric: "tabular-nums" }}>{value}</div>
      </div>
    </div>
  );
}

function FarmPage({ farmKey, farm, totals, records, members, subTab, setSubTab, saveRecords, memberCapital, isEditor, onRequestUnlock, requestPrint }) {
  const subTabs = [
    { key: "ledger", label: "জমা/উত্তোলন" }, { key: "expense", label: "খরচ" },
    { key: "income", label: "আয়" }, { key: "report", label: "রিপোর্ট" },
  ];
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ display: "flex", gap: 4, borderBottom: `1px solid ${T.border}`, overflowX: "auto" }}>
        {subTabs.map((s) => (
          <button key={s.key} onClick={() => setSubTab(s.key)} style={{
            border: "none", background: "transparent", padding: "8px 12px", fontSize: 13.5, fontWeight: 600,
            cursor: "pointer", color: subTab === s.key ? farm.color : T.inkSoft,
            borderBottom: subTab === s.key ? `2.5px solid ${farm.color}` : "2.5px solid transparent",
            fontFamily: "'Hind Siliguri', sans-serif", whiteSpace: "nowrap",
          }}>{s.label}</button>
        ))}
      </div>
      {subTab === "ledger" && <LedgerTab farm={farm} farmKey={farmKey} records={records} members={members} saveRecords={saveRecords} memberCapital={memberCapital} isEditor={isEditor} onRequestUnlock={onRequestUnlock} requestPrint={requestPrint} />}
      {subTab === "expense" && <MoneyTab type="expense" farm={farm} items={records.expenses} categories={farm.expenseCats} onSave={(items) => saveRecords({ ...records, expenses: items })} isEditor={isEditor} onRequestUnlock={onRequestUnlock} requestPrint={requestPrint} />}
      {subTab === "income" && <MoneyTab type="income" farm={farm} items={records.incomes} categories={farm.incomeCats} onSave={(items) => saveRecords({ ...records, incomes: items })} isEditor={isEditor} onRequestUnlock={onRequestUnlock} requestPrint={requestPrint} />}
      {subTab === "report" && <ReportTab farm={farm} farmKey={farmKey} totals={totals} records={records} members={members} memberCapital={memberCapital} requestPrint={requestPrint} />}
    </div>
  );
}

function LedgerTab({ farm, farmKey, records, members, saveRecords, memberCapital, isEditor, onRequestUnlock, requestPrint }) {
  const [form, setForm] = useState({ memberId: members[0]?.id || "", type: "জমা", amount: "", date: todayStr(), note: "" });
  useEffect(() => { if (!form.memberId && members[0]) setForm((f) => ({ ...f, memberId: members[0].id })); }, [members]);

  const add = () => {
    if (!isEditor || !form.memberId || !form.amount) return;
    const entry = { id: uid(), ...form, amount: Number(form.amount) };
    saveRecords({ ...records, deposits: [entry, ...records.deposits] });
    setForm({ ...form, amount: "", note: "" });
  };
  const remove = (id) => isEditor && saveRecords({ ...records, deposits: records.deposits.filter((d) => d.id !== id) });
  const clearAll = () => isEditor && saveRecords({ ...records, deposits: [] });
  const nameOf = (id) => members.find((m) => m.id === id)?.name || "অজানা সদস্য";
  const sorted = [...records.deposits].sort((a, b) => (a.date < b.date ? 1 : -1));

  const printAll = () => requestPrint({
    title: `${farm.label} — জমা/উত্তোলনের হিসাব`,
    sections: [{ table: { columns: [{ key: "date", label: "তারিখ" }, { key: "name", label: "সদস্য" }, { key: "type", label: "ধরন" }, { key: "amount", label: "পরিমাণ" }, { key: "note", label: "নোট" }], rows: sorted.map((d) => ({ date: d.date, name: nameOf(d.memberId), type: d.type, amount: taka(d.amount), note: d.note || "" })) } }],
  });

  if (members.length === 0) return <EmptyNote text="প্রথমে “সদস্যগণ” ট্যাব থেকে সদস্য যোগ করুন।" />;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <PageFrame>
        <EditGate isEditor={isEditor} onRequestUnlock={onRequestUnlock} />
        {isEditor && (
          <div style={{ padding: 14, display: "flex", flexWrap: "wrap", gap: 10, alignItems: "flex-end" }}>
            <Field label="সদস্য"><SelectInput value={form.memberId} onChange={(e) => setForm({ ...form, memberId: e.target.value })}>{members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}</SelectInput></Field>
            <Field label="ধরন"><SelectInput value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}><option value="জমা">জমা</option><option value="উত্তোলন">উত্তোলন</option></SelectInput></Field>
            <Field label="পরিমাণ (৳)"><TextInput type="number" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} placeholder="০" /></Field>
            <Field label="তারিখ"><TextInput type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="নোট (ঐচ্ছিক)"><TextInput value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="মন্তব্য" /></Field>
            <LedgerButton onClick={add} color={farm.color}><Emoji size={15}>➕</Emoji> যোগ করুন</LedgerButton>
          </div>
        )}
      </PageFrame>
      <PageFrame>
        <SectionHeader title="জমা/উত্তোলনের তালিকা" right={<div style={{ display: "flex", gap: 8 }}><PdfButton onClick={printAll} color={farm.color} />{isEditor && sorted.length > 0 && <TwoStepBulk onConfirm={clearAll} />}</div>} />
        {sorted.length === 0 ? <EmptyNote text="এখনও কোনো জমা/উত্তোলন যোগ করা হয়নি।" /> : sorted.map((d, i) => (
          <RuledRow key={d.id} index={i}>
            <span style={{ width: 84, color: T.inkSoft, fontSize: 12.5 }}>{d.date}</span>
            <span style={{ flex: 1 }}>{nameOf(d.memberId)}{d.note ? <span style={{ color: T.inkSoft }}> — {d.note}</span> : null}</span>
            <span style={{ fontWeight: 700, color: d.type === "জমা" ? T.goat : T.danger, fontVariantNumeric: "tabular-nums" }}>{d.type === "জমা" ? "+" : "−"}{taka(d.amount)}</span>
            {isEditor && <TwoStepDelete onConfirm={() => remove(d.id)} />}
          </RuledRow>
        ))}
      </PageFrame>
      <PageFrame>
        <SectionHeader title={`সদস্য অনুযায়ী মূলধন — ${farm.label}`} />
        {members.map((m, i) => (
          <RuledRow key={m.id} index={i}>
            <span style={{ flex: 1 }}>{m.name}</span>
            <span style={{ fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>{taka(memberCapital(m.id, farmKey))}</span>
          </RuledRow>
        ))}
      </PageFrame>
    </div>
  );
}

function MoneyTab({ type, farm, items, categories, onSave, isEditor, onRequestUnlock, requestPrint }) {
  const isExpense = type === "expense";
  const [form, setForm] = useState({ category: categories[0], amount: "", date: todayStr(), note: "" });
  const add = () => {
    if (!isEditor || !form.amount) return;
    const entry = { id: uid(), ...form, amount: Number(form.amount) };
    onSave([entry, ...items]);
    setForm({ ...form, amount: "", note: "" });
  };
  const remove = (id) => isEditor && onSave(items.filter((it) => it.id !== id));
  const clearAll = () => isEditor && onSave([]);
  const sorted = [...items].sort((a, b) => (a.date < b.date ? 1 : -1));
  const total = sum(items, (it) => it.amount);

  const printAll = () => requestPrint({
    title: `${farm.label} — ${isExpense ? "খরচের হিসাব" : "আয়ের হিসাব"}`,
    sections: [{ table: { columns: [{ key: "date", label: "তারিখ" }, { key: "category", label: "খাত" }, { key: "amount", label: "পরিমাণ" }, { key: "note", label: "নোট" }], rows: sorted.map((it) => ({ date: it.date, category: it.category, amount: taka(it.amount), note: it.note || "" })) } }],
  });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <PageFrame>
        <EditGate isEditor={isEditor} onRequestUnlock={onRequestUnlock} />
        {isEditor && (
          <div style={{ padding: 14, display: "flex", flexWrap: "wrap", gap: 10, alignItems: "flex-end" }}>
            <Field label="খাত"><SelectInput value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>{categories.map((c) => <option key={c} value={c}>{c}</option>)}</SelectInput></Field>
            <Field label="পরিমাণ (৳)"><TextInput type="number" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} placeholder="০" /></Field>
            <Field label="তারিখ"><TextInput type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="নোট (ঐচ্ছিক)"><TextInput value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="মন্তব্য" /></Field>
            <LedgerButton onClick={add} color={isExpense ? T.danger : farm.color}><Emoji size={15}>➕</Emoji> যোগ করুন</LedgerButton>
          </div>
        )}
      </PageFrame>
      <PageFrame>
        <SectionHeader title={isExpense ? "খরচের তালিকা" : "আয়ের তালিকা"} right={<div style={{ display: "flex", gap: 8 }}><PdfButton onClick={printAll} color={isExpense ? T.danger : farm.color} />{isEditor && sorted.length > 0 && <TwoStepBulk onConfirm={clearAll} />}</div>} />
        {sorted.length === 0 ? <EmptyNote text={isExpense ? "এখনও কোনো খরচ যোগ করা হয়নি।" : "এখনও কোনো আয় যোগ করা হয়নি।"} /> : (
          <>
            {sorted.map((it, i) => (
              <RuledRow key={it.id} index={i}>
                <span style={{ width: 84, color: T.inkSoft, fontSize: 12.5 }}>{it.date}</span>
                <span style={{ flex: 1 }}>{it.category}{it.note ? <span style={{ color: T.inkSoft }}> — {it.note}</span> : null}</span>
                <span style={{ fontWeight: 700, color: isExpense ? T.danger : T.goat, fontVariantNumeric: "tabular-nums" }}>{taka(it.amount)}</span>
                {isEditor && <TwoStepDelete onConfirm={() => remove(it.id)} />}
              </RuledRow>
            ))}
            <div style={{ display: "flex", padding: "10px 16px", fontWeight: 700, fontSize: 14 }}><span style={{ flex: 1 }}>মোট</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{taka(total)}</span></div>
          </>
        )}
      </PageFrame>
    </div>
  );
}

function ReportTab({ farm, farmKey, totals, records, members, memberCapital, requestPrint }) {
  const chartData = [{ name: "আয়", value: totals.income, fill: farm.color }, { name: "খরচ", value: totals.expense, fill: T.danger }];
  const nameOf = (id) => members.find((m) => m.id === id)?.name || "অজানা সদস্য";

  const printReport = () => {
    const deposits = [...records.deposits].sort((a, b) => (a.date < b.date ? 1 : -1));
    const expenses = [...records.expenses].sort((a, b) => (a.date < b.date ? 1 : -1));
    const incomes = [...records.incomes].sort((a, b) => (a.date < b.date ? 1 : -1));
    requestPrint({
      title: `${farm.label} — লাভ-ক্ষতির রিপোর্ট`,
      sections: [
        { summaryRows: [["মোট জমা", taka(totals.deposit)], ["মোট উত্তোলন", taka(totals.withdraw)], ["সদস্য-মূলধন (নিট)", taka(totals.capital)], ["মোট আয়", taka(totals.income)], ["মোট খরচ", taka(totals.expense)], ["নিট লাভ/ক্ষতি", taka(totals.profit)]] },
        { heading: "সদস্য অনুযায়ী মূলধন", tables: members.length ? [{ columns: [{ key: "name", label: "নাম" }, { key: "capital", label: "মূলধন" }], rows: members.map((m) => ({ name: m.name, capital: taka(memberCapital(m.id, farmKey)) })) }] : [] },
        { heading: "বিস্তারিত হিসাব", tables: [
          deposits.length ? { title: "জমা/উত্তোলন", columns: [{ key: "date", label: "তারিখ" }, { key: "name", label: "সদস্য" }, { key: "type", label: "ধরন" }, { key: "amount", label: "পরিমাণ" }], rows: deposits.map((d) => ({ date: d.date, name: nameOf(d.memberId), type: d.type, amount: taka(d.amount) })) } : null,
          expenses.length ? { title: "খরচ", columns: [{ key: "date", label: "তারিখ" }, { key: "category", label: "খাত" }, { key: "amount", label: "পরিমাণ" }], rows: expenses.map((e) => ({ date: e.date, category: e.category, amount: taka(e.amount) })) } : null,
          incomes.length ? { title: "আয়", columns: [{ key: "date", label: "তারিখ" }, { key: "category", label: "খাত" }, { key: "amount", label: "পরিমাণ" }], rows: incomes.map((inc) => ({ date: inc.date, category: inc.category, amount: taka(inc.amount) })) } : null,
        ].filter(Boolean) },
      ],
    });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <PageFrame>
        <SectionHeader title={`${farm.label} — রিপোর্ট`} right={<PdfButton onClick={printReport} color={farm.color} />} />
        <div style={{ padding: 16, display: "flex", flexWrap: "wrap", gap: 20 }}>
          <Metric label="মোট জমা" value={taka(totals.deposit)} />
          <Metric label="মোট উত্তোলন" value={taka(totals.withdraw)} />
          <Metric label="সদস্য-মূলধন (নিট)" value={taka(totals.capital)} bold />
          <Metric label="মোট আয়" value={taka(totals.income)} />
          <Metric label="মোট খরচ" value={taka(totals.expense)} />
          <Metric label="নিট লাভ/ক্ষতি" value={taka(totals.profit)} color={totals.profit >= 0 ? T.goat : T.danger} bold />
        </div>
      </PageFrame>
      <PageFrame>
        <SectionHeader title="আয় বনাম খরচ" />
        <SimpleBarChart data={chartData} />
      </PageFrame>
      <PageFrame>
        <SectionHeader title={`সদস্য অনুযায়ী মূলধন — ${farm.label}`} />
        {members.length === 0 ? <EmptyNote text="কোনো সদস্য নেই।" /> : members.map((m, i) => (
          <RuledRow key={m.id} index={i}><span style={{ flex: 1 }}>{m.name}</span><span style={{ fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>{taka(memberCapital(m.id, farmKey))}</span></RuledRow>
        ))}
      </PageFrame>
    </div>
  );
}

function WhatsAppTab({ items, onSave, isEditor, onRequestUnlock, requestPrint }) {
  const [form, setForm] = useState({ name: "", number: "", note: "" });
  const add = () => {
    if (!isEditor || !form.name.trim() || !form.number.trim()) return;
    onSave([{ id: uid(), ...form }, ...items]);
    setForm({ name: "", number: "", note: "" });
  };
  const remove = (id) => isEditor && onSave(items.filter((it) => it.id !== id));
  const clearAll = () => isEditor && onSave([]);
  const printAll = () => requestPrint({
    title: "WhatsApp নাম্বারের তালিকা",
    sections: [{ table: { columns: [{ key: "name", label: "নাম" }, { key: "number", label: "WhatsApp নাম্বার" }, { key: "note", label: "নোট" }], rows: items.map((it) => ({ name: it.name, number: it.number, note: it.note || "" })) } }],
  });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <PageFrame>
        <EditGate isEditor={isEditor} onRequestUnlock={onRequestUnlock} />
        {isEditor && (
          <div style={{ padding: 14, display: "flex", flexWrap: "wrap", gap: 10, alignItems: "flex-end" }}>
            <Field label="নাম"><TextInput value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="নাম" /></Field>
            <Field label="WhatsApp নাম্বার"><TextInput value={form.number} onChange={(e) => setForm({ ...form, number: e.target.value })} placeholder="+৮৮০১XXXXXXXXX" /></Field>
            <Field label="নোট (ঐচ্ছিক)"><TextInput value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="যেমন: সভাপতি" /></Field>
            <LedgerButton onClick={add} color={T.whatsapp}><Emoji size={15}>➕</Emoji> যোগ করুন</LedgerButton>
          </div>
        )}
      </PageFrame>
      <PageFrame>
        <SectionHeader title="WhatsApp নাম্বার তালিকা" right={<div style={{ display: "flex", gap: 8 }}><PdfButton onClick={printAll} color={T.whatsapp} />{isEditor && items.length > 0 && <TwoStepBulk onConfirm={clearAll} />}</div>} />
        {items.length === 0 ? <EmptyNote text="এখনও কোনো নাম্বার যোগ করা হয়নি।" /> : items.map((it, i) => (
          <RuledRow key={it.id} index={i}>
            <Emoji size={15}>💬</Emoji>
            <span style={{ flex: 1 }}>{it.name}{it.note ? <span style={{ color: T.inkSoft }}> — {it.note}</span> : null}</span>
            <span style={{ fontVariantNumeric: "tabular-nums", color: T.inkSoft }}>{it.number}</span>
            {isEditor && <TwoStepDelete onConfirm={() => remove(it.id)} />}
          </RuledRow>
        ))}
      </PageFrame>
    </div>
  );
}

function MembersPage({ members, memberForm, setMemberForm, addMember, removeMember, memberTotalCapital, memberCapital, isEditor, onRequestUnlock, requestPrint }) {
  const printAll = () => requestPrint({
    title: "সদস্যদের তালিকা",
    sections: [{ table: { columns: [{ key: "name", label: "নাম" }, { key: "phone", label: "মোবাইল" }, { key: "joinDate", label: "যোগদান" }, { key: "capital", label: "সর্বমোট মূলধন" }], rows: members.map((m) => ({ name: m.name, phone: m.phone || "-", joinDate: m.joinDate, capital: taka(memberTotalCapital(m.id)) })) } }],
  });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <PageFrame>
        <EditGate isEditor={isEditor} onRequestUnlock={onRequestUnlock} />
        {isEditor && (
          <div style={{ padding: 14, display: "flex", flexWrap: "wrap", gap: 10, alignItems: "flex-end" }}>
            <Field label="নাম"><TextInput value={memberForm.name} onChange={(e) => setMemberForm({ ...memberForm, name: e.target.value })} placeholder="সদস্যের নাম" /></Field>
            <Field label="মোবাইল নম্বর"><TextInput value={memberForm.phone} onChange={(e) => setMemberForm({ ...memberForm, phone: e.target.value })} placeholder="০১XXXXXXXXX" /></Field>
            <Field label="যোগদানের তারিখ"><TextInput type="date" value={memberForm.joinDate} onChange={(e) => setMemberForm({ ...memberForm, joinDate: e.target.value })} /></Field>
            <LedgerButton onClick={addMember} color={T.gold}><Emoji size={15}>➕</Emoji> সদস্য যোগ করুন</LedgerButton>
          </div>
        )}
      </PageFrame>
      <PageFrame>
        <SectionHeader title="সদস্যদের তালিকা" right={<PdfButton onClick={printAll} color={T.gold} />} />
        {members.length === 0 ? <EmptyNote text="এখনও কোনো সদস্য যোগ করা হয়নি।" /> : members.map((m, i) => (
          <RuledRow key={m.id} index={i} style={{ flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 140px" }}>
              <div style={{ fontWeight: 600 }}>{m.name}</div>
              <div style={{ fontSize: 12, color: T.inkSoft, display: "flex", alignItems: "center", gap: 4 }}>
                {m.phone ? <><Emoji size={11}>📞</Emoji> {m.phone}</> : "—"}
              </div>
            </div>
            <div style={{ fontSize: 12, color: T.inkSoft, width: 100 }}>যোগদান: {m.joinDate}</div>
            <div style={{ textAlign: "right", width: 110 }}>
              <div style={{ fontSize: 11, color: T.inkSoft }}>সর্বমোট মূলধন</div>
              <div style={{ fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>{taka(memberTotalCapital(m.id))}</div>
            </div>
            {isEditor && <TwoStepDelete onConfirm={() => removeMember(m.id)} />}
          </RuledRow>
        ))}
      </PageFrame>
      {members.length > 0 && (
        <PageFrame>
          <SectionHeader title="খামারভিত্তিক মূলধনের বিস্তারিত" />
          {members.map((m, i) => (
            <RuledRow key={m.id} index={i}>
              <span style={{ flex: 1 }}>{m.name}</span>
              {Object.entries(FARMS).map(([k, f]) => <span key={k} style={{ fontSize: 12, color: f.color, width: 78, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{taka(memberCapital(m.id, k))}</span>)}
            </RuledRow>
          ))}
          <div style={{ display: "flex", padding: "6px 16px 12px", fontSize: 11, color: T.inkSoft }}>
            <span style={{ flex: 1 }}></span>
            {Object.values(FARMS).map((f, i) => <span key={i} style={{ width: 78, textAlign: "right" }}>{f.label.split(" ")[0]}</span>)}
          </div>
        </PageFrame>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<KhamarHisab />);
</script>
